  pagos.cobros.recuperado.v1:
    description: 'PaymentRecovered · productor: ARC-033 → consumidor: ARC-031'
    x-mind-transport: internal
    x-mind-audience: internal
    publish:
      message: &id014
        $ref: '#/components/messages/PaymentRecovered'
      operationId: EVT-014
    subscribe:
