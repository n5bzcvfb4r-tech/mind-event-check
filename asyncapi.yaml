components:
  messages:
    BankStatementDeposited:
      name: BankStatementDeposited
      summary: nombre de fichero, hash SHA-256 del contenido, fecha del extracto y
        entidad emisora, sin IBAN completo
      payload:
        type: object
        description: Payload de BankStatementDeposited
        x-mind-placeholder: true
    InvoiceIssued:
      name: InvoiceIssued
      summary: invoice_id, invoice_number, subscription_id, user_id, amount_cents,
        due_date, generation_source (SIGNUP/SCHEDULED) y payment_method_type congelado
        en la factura
      payload:
        type: object
        description: Payload de InvoiceIssued
        x-mind-placeholder: true
    InvoiceUnpaid:
      name: InvoiceUnpaid
      summary: exactamente invoice_id, invoice_number, user_id, amount_cents, due_date
        y modality_code, sin datos de pago
      payload:
        type: object
        description: Payload de InvoiceUnpaid
        x-mind-placeholder: true
    PaymentAuthorized:
      name: PaymentAuthorized
      summary: event_id, correlation_id, user_id, transaction_id, invoice_id, gateway_name,
        payment_method, subscription_mode, amount_cents, currency y occurred_at; de
        la tarjeta, como máximo last_four_digits
      payload:
        type: object
        description: Payload de PaymentAuthorized
        x-mind-placeholder: true
    PaymentFailed:
      name: PaymentFailed
      summary: event_id, correlation_id, user_id, transaction_id, invoice_id, billing_period_start,
        canonical_error_code, error_nature y close_reason del ciclo de impago (EXHAUSTED/USER_CANCELLED)
        cuando el fallo lo cierra
      payload:
        type: object
        description: Payload de PaymentFailed
        x-mind-placeholder: true
    PaymentProcessed:
      name: PaymentProcessed
      summary: payment_id, user_id, subscription_id, status, amount, currency y timestamp
        del cobro PayPal
      payload:
        type: object
        description: Payload de PaymentProcessed
        x-mind-placeholder: true
    PaymentRecovered:
      name: PaymentRecovered
      summary: invoice_id, payment_transaction_id, amount y recovered_at del ciclo
        de recobro cerrado en RECOVERED, sin datos de tarjeta
      payload:
        type: object
        description: Payload de PaymentRecovered
        x-mind-placeholder: true
    RefundCompleted:
      name: RefundCompleted
      summary: refund_request_id, cancellation_id, original_transaction_id, refund_ledger_id,
        correlation_id, payment_method, refund_amount_cents y completed_at
      payload:
        type: object
        description: Payload de RefundCompleted
        x-mind-placeholder: true
    RefundFailed:
      name: RefundFailed
      summary: refund_request_id, cancellation_id, original_transaction_id, payment_method,
        failure_code canónico, manual_review_reason y timestamp
      payload:
        type: object
        description: Payload de RefundFailed
        x-mind-placeholder: true
    SubscriptionCancelled:
      name: SubscriptionCancelled
      summary: cancellation_id, subscription_id, user_id, cancelled_at y billing_period_start
        del ciclo de impago abierto, si lo hay
      payload:
        type: object
        description: Payload de SubscriptionCancelled
        x-mind-placeholder: true
    TransferenceFailed:
      name: TransferenceFailed
      summary: transaction_id, user_id, amount, error_code canónico, retry_count y
        timestamp, sin IBAN completo
      payload:
        type: object
        description: Payload de TransferenceFailed
        x-mind-placeholder: true
    TransferenceManualReview:
      name: TransferenceManualReview
      summary: transaction_id, user_id, amount, error_code canónico, retry_count agotado
        y timestamp de escalado
      payload:
        type: object
        description: Payload de TransferenceManualReview
        x-mind-placeholder: true
    TransferencePending:
      name: TransferencePending
      summary: transaction_id, user_id, iban_last_4, amount, subscription_period_start/end
        e initiated_timestamp
      payload:
        type: object
        description: Payload de TransferencePending
        x-mind-placeholder: true
    TransferenceSucceeded:
      name: TransferenceSucceeded
      summary: transaction_id, user_id, iban_last_4, amount, subscription_period_start/end,
        bank_reference_id y completed_timestamp
      payload:
        type: object
        description: Payload de TransferenceSucceeded
        x-mind-placeholder: true
