asyncapi: 2.6.0
info:
  title: mind-event-check — Eventos
  version: 0.1.0
  description: 'Catálogo de eventos generado por MIND desde T.3 (PR #0). Los canales
    con x-mind-audience: client son el contrato cliente↔servidor en tiempo real; los
    payloads marcados x-mind-placeholder los completa la construcción.'
channels:
  pagos.conciliacion.extracto-depositado.v1:
    description: 'BankStatementDeposited · productor: ARC-005 → consumidor: ARC-026'
    x-mind-transport: internal
    x-mind-audience: internal
    publish:
      message: &id001
        $ref: '#/components/messages/BankStatementDeposited'
      operationId: EVT-001
    subscribe:
      message: *id001
  facturacion.facturas.emitida.v1:
    description: 'InvoiceIssued · productor: ARC-024 → consumidor: ARC-024'
    x-mind-transport: internal
    x-mind-audience: internal
    publish:
