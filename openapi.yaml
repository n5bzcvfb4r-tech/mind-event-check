openapi: 3.0.3
info:
  title: mind-event-check — API
  version: 0.1.0
  description: 'Contrato generado por MIND desde los contratos de arquitectura (T.3,
    contract-first PR #0). Paths, verbos y campos de los schemas son LEY; los esquemas
    marcados x-mind-placeholder aún no tienen campos y los completa la construcción
    sin cambiar path/verb.'
servers:
- url: /api
  description: Base pública de la API
paths:
  /users:
    post:
      operationId: EP-001
      summary: Registra un socio con sus datos personales y su contraseña, y envía
        el email de confirmación
      tags:
      - ARC-020
      x-mind-implemented-by: ARC-024
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRegistrationResponse'
        '401':
          description: No autenticado
        '403':
          description: Prohibido
      x-required-roles: []
      security:
      - bearerAuth: []
      x-mind-access: deny-all
  /users/availability:
    get:
      operationId: EP-002
      summary: Comprueba si un email o un nick están libres antes del registro
      tags:
      - ARC-020
      x-mind-implemented-by: ARC-024
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAvailabilityResponse'
        '401':
          description: No autenticado
        '403':
          description: Prohibido
      x-required-roles: []
      security:
      - bearerAuth: []
      x-mind-access: deny-all
  /email-verifications:
    post:
      operationId: EP-003
      summary: Confirma el email con el token del enlace y activa la cuenta
      tags:
      - ARC-020
      x-mind-implemented-by: ARC-024
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationConfirmRequest'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailVerificationResult'
        '401':
          description: No autenticado
        '403':
          description: Prohibido
      x-required-roles: []
      security:
      - bearerAuth: []
      x-mind-access: deny-all
  /email-verification-resends:
    post:
      operationId: EP-004
      summary: Reenvía el enlace de confirmación con un token nuevo de 24 h
      tags:
      - ARC-020
      x-mind-implemented-by: ARC-024
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationResendRequest'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
        '401':
          description: No autenticado
        '403':
          description: Prohibido
      x-required-roles: []
      security:
      - bearerAuth: []
      x-mind-access: deny-all
  /sessions:
    post:
      operationId: EP-005
      summary: Inicia sesión con email o nick y contraseña, y emite la sesión segura
      tags:
      - ARC-020
      x-mind-implemented-by: ARC-024
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          description: No autenticado
        '403':
          description: Prohibido
      x-required-roles: []
      security:
      - bearerAuth: []
      x-mind-access: deny-all
  /sessions/current:
    delete:
      operationId: EP-006
      summary: Cierra y revoca la sesión actual
      tags:
      - ARC-020
      x-mind-implemented-by: ARC-024
      responses:
        '204':
          description: OK
        '401':
          description: No autenticado
        '403':
          description: Prohibido
      x-required-roles: []
      security:
      - bearerAuth: []
      x-mind-access: deny-all
  /me/sessions:
    get:
      operationId: EP-007
      summary: Lista las sesiones abiertas del socio
      tags:
      - ARC-020
      x-mind-implemented-by: ARC-024
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
        '401':
          description: No autenticado
        '403':
          description: Prohibido
      x-required-roles: []
      security:
      - bearerAuth: []
      x-mind-access: deny-all
  /me/sessions/{sessionId}:
    delete:
      operationId: EP-008
      summary: Revoca una sesión propia
      tags:
      - ARC-020
      x-mind-implemented-by: ARC-024
      responses:
        '204':
          description: OK
        '401':
          description: No autenticado
        '403':
          description: Prohibido
      x-required-roles: []
      security:
      - bearerAuth: []
      x-mind-access: deny-all
  /me/profile:
    get:
      operationId: EP-009
      summary: Devuelve los datos personales del socio autenticado
      tags:
      - ARC-020
      x-mind-implemented-by: ARC-024
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileDetail'
        '401':
          description: No autenticado
        '403':
          description: Prohibido
      x-required-roles: []
      security:
      - bearerAuth: []
      x-mind-access: deny-all
    patch:
      operationId: EP-010
      summary: Actualiza los datos personales editables (todos salvo el nick)
      tags:
      - ARC-020
      x-mind-implemented-by: ARC-024
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileDetail'
        '401':
          description: No autenticado
        '403':
          description: Prohibido
      x-required-roles: []
      security:
      - bearerAuth: []
      x-mind-access: deny-all
  /me/password:
    put:
      operationId: EP-011
      summary: Cambia la contraseña verificando la actual y revoca las demás sesiones
      tags:
      - ARC-020
      x-mind-implemented-by: ARC-024
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '200':
          description: OK
        '401':
          description: No autenticado
        '403':
          description: Prohibido
      x-required-roles: []
      security:
      - bearerAuth: []
      x-mind-access: deny-all
  /password-resets:
    post:
      operationId: EP-012
      summary: Solicita el enlace de recuperación de contraseña con una respuesta
        genérica
      tags:
      - ARC-020
      x-mind-implemented-by: ARC-024
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
        '401':
          description: No autenticado
        '403':
          description: Prohibido
      x-required-roles: []
      security:
      - bearerAuth: []
      x-mind-access: deny-all
  /password-resets/token-validations:
    post:
      operationId: EP-013
      summary: Valida el token de recuperación antes de mostrar el formulario
      tags:
      - ARC-020
      x-mind-implemented-by: ARC-024
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetTokenRequest'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetTokenStatus'
        '401':
          description: No autenticado
        '403':
          description: Prohibido
      x-required-roles: []
      security:
      - bearerAuth: []
      x-mind-access: deny-all
  /password-resets/confirmations:
    post:
      operationId: EP-014
      summary: Fija la nueva contraseña y consume el token de recuperación
      tags:
      - ARC-020
      x-mind-implemented-by: ARC-024
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
      responses:
        '201':
          description: OK
        '401':
          description: No autenticado
        '403':
          description: Prohibido
      x-required-roles: []
      security:
      - bearerAuth: []
      x-mind-access: deny-all
  /me/payment-methods:
    get:
      operationId: EP-015
      summary: Lista los métodos de pago activos del socio, enmascarados
      tags:
      - ARC-020
      x-mind-implemented-by: ARC-024
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethodList'
        '401':
          description: No autenticado
        '403':
          description: Prohibido
      x-required-roles: []
      security:
      - bearerAuth: []
      x-mind-access: deny-all
  /me/payment-methods/bank-accounts:
    post:
      operationId: EP-016
      summary: Registra un IBAN validado según ISO 13616 y lo guarda cifrado
      tags:
      - ARC-020
      x-mind-implemented-by: ARC-024
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankAccountCreateRequest'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethodSummary'
        '401':
          description: No autenticado
        '403':
          description: Prohibido
      x-required-roles: []
      security:
      - bearerAuth: []
      x-mind-access: deny-all
  /me/payment-methods/cards:
    post:
      operationId: EP-017
      summary: Registra una tarjeta tokenizada en el gateway, sin persistir el PAN
        ni el CVV
      tags:
      - ARC-020
      x-mind-implemented-by: ARC-024
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardPaymentMethodCreateRequest'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethodSummary'
        '401':
          description: No autenticado
        '403':
          description: Prohibido
      x-required-roles: []
      security:
      - bearerAuth: []
      x-mind-access: deny-all
  /me/payment-methods/paypal-authorizations:
    post:
      operationId: EP-018
      summary: Inicia la vinculación OAuth2 de PayPal y devuelve la URL de autorización
      tags:
      - ARC-020
      x-mind-implemented-by: ARC-024
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayPalAuthorizationResponse'
        '401':
          description: No autenticado
        '403':
          description: Prohibido
      x-required-roles: []
      security:
      - bearerAuth: []
      x-mind-access: deny-all
  /me/payment-methods/paypal-accounts:
    post:
      operationId: EP-019
      summary: Completa la vinculación de PayPal con el código y el state del callback
      tags:
      - ARC-020
      x-mind-implemented-by: ARC-024
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayPalAccountLinkRequest'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethodSummary'
        '401':
          description: No autenticado
        '403':
          description: Prohibido
      x-required-roles: []
      security:
      - bearerAuth: []
      x-mind-access: deny-all
  /me/payment-methods/default:
    put:
      operationId: EP-020
      summary: Marca un método de pago como el único predeterminado
      tags:
      - ARC-020
      x-mind-implemented-by: ARC-024
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefaultPaymentMethodRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethodSummary'
        '401':
          description: No autenticado
        '403':
          description: Prohibido
      x-required-roles: []
      security:
      - bearerAuth: []
      x-mind-access: deny-all
  /me/payment-methods/{paymentMethodId}:
    delete:
      operationId: EP-021
      summary: Elimina de forma lógica un método de pago propio y reasigna el predeterminado
      tags:
      - ARC-020
      x-mind-implemented-by: ARC-024
      responses:
        '204':
          description: OK
        '401':
          description: No autenticado
        '403':
          description: Prohibido
      x-required-roles: []
      security:
      - bearerAuth: []
      x-mind-access: deny-all
  /me/payment-methods/{paymentMethodId}/replacements:
    post:
      operationId: EP-022
      summary: Sustituye una tarjeta caducada o próxima a caducar y reanuda el dunning
        suspendido
      tags:
      - ARC-020
      x-mind-implemented-by: ARC-024
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardReplacementRequest'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardReplacementResult'
        '401':
          description: No autenticado
        '403':
          description: Prohibido
      x-required-roles: []
      security:
      - bearerAuth: []
      x-mind-access: deny-all
  /subscription-plans:
    get:
      operationId: EP-023
      summary: Muestra las modalidades activas con precio, equivalente mensual y ahorro
      tags:
      - ARC-020
      x-mind-implemented-by: ARC-024
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionPlanList'
