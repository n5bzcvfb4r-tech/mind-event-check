                $ref: '#/components/schemas/SubscriptionCreated'
        '401':
          description: No autenticado
        '403':
          description: Prohibido
      x-required-roles: []
      security:
      - bearerAuth: []
      x-mind-access: deny-all
  /me/subscription:
    get:
      operationId: EP-025
      summary: Devuelve la modalidad, la próxima renovación, el método enmascarado
        y el estado de baja y devolución
      tags:
      - ARC-020
      x-mind-implemented-by: ARC-024
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionSummary'
        '401':
          description: No autenticado
        '403':
          description: Prohibido
      x-required-roles: []
      security:
      - bearerAuth: []
      x-mind-access: deny-all
  /me/subscription/plan-changes:
