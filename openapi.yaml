      tags:
      - ARC-020
      x-mind-implemented-by: ARC-024
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionCreateRequest'
      responses:
        '201':
          description: OK
