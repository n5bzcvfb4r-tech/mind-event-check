        '401':
          description: No autenticado
        '403':
          description: Prohibido
      x-required-roles: []
      security:
      - bearerAuth: []
      x-mind-access: deny-all
  /me/subscription/plan-changes/{planChangeId}:
    delete:
      operationId: EP-027
      summary: Anula un cambio de modalidad pendiente hasta la víspera de su aplicación
      tags:
      - ARC-020
      x-mind-implemented-by: ARC-024
      responses:
        '204':
          description: OK
        '401':
          description: No autenticado
        '403':
          description: Prohibido
      x-required-roles: []
      security:
      - bearerAuth: []
      x-mind-access: deny-all
  /me/subscription/cancellation-preview:
